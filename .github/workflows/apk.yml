name: Build Sinoky APK

# 触发方式：
# 1. push tag v*（发版：bump 版本 -> git tag v0.11.0 -> git push --tags -> 出 release APK：挂 GitHub Release + 推 Pages /apk/ 供应用内更新）
# 2. workflow_dispatch 手动（默认 release；debug 仅调试用——debug 签名随机，不可覆盖安装）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      buildType:
        description: 'release (fixed keystore, in-app update compatible) or debug (random signature)'
        required: true
        default: 'release'
        type: choice
        options: [release, debug]

permissions:
  contents: write   # needed to create Release and upload APK on tag push

env:
  BUILD_TYPE: ${{ github.event.inputs.buildType || 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Capacitor CLI 8.x requires Node >= 22 (fatal otherwise)
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build web assets into www/
        run: npm run build:web

      - name: Create android project (not committed — generated each run)
        run: |
          rm -rf android
          node ./node_modules/@capacitor/cli/bin/capacitor add android > cap_add.log 2>&1 || echo "CAP_FAILED=1" >> "$GITHUB_ENV"
          # cap add 自带 sync（copy web assets + update plugins），此处只验证产物
          test -f android/app/build.gradle || {
            echo "::error::log-size:$(wc -c < cap_add.log 2>/dev/null || echo NOFILE)"
            echo "::error::log-tail:$(tail -c 350 cap_add.log 2>/dev/null | tr '\n' '~')"
            exit 1
          }
          echo "android project OK: $(ls android | tr '\n' ' ')"

      - name: Inject mic/camera permissions (getUserMedia in WebView for ASR scoring)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "RECORD_AUDIO" $M || sed -i 's#<uses-permission android:name="android.permission.INTERNET"#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.INTERNET"#' $M
          grep -o 'android.permission.[A-Z_]*' $M | sort -u

      - name: Inject in-app update plugin (UpdatePlugin + register + provider paths + install permission)
        run: |
          PKGDIR=android/app/src/main/java/app/sinoky/pwa
          mkdir -p "$PKGDIR"
          cat > "$PKGDIR/UpdatePlugin.java" <<'EOF'
          package app.sinoky.pwa;

          import android.content.Context;
          import android.content.Intent;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.provider.MediaStore;
          import android.util.Base64;
          import java.io.OutputStream;
          import android.content.pm.PackageInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;

          /**
           * v0.12.0: in-app HTTP direct full download (replaces DownloadManager).
           * Why: Cloudflare Pages does not support Range requests, so DownloadManager
           * downloads die mid-way on weak networks / when the app goes to background
           * (real-device verified). A plain HttpURLConnection full download is immune.
           * Adds: progress events, cancel, and PK-magic + MD5 + size verification before
           * install (guards against HTML-fallback fake APK served with HTTP 200).
           */
          @CapacitorPlugin(name = "UpdatePlugin")
          public class UpdatePlugin extends Plugin {

            private volatile boolean downloading = false;
            private volatile boolean cancelled = false;

              /* v0.13.1: Toast must run on a Looper (main) thread. v0.12.0-v0.13.0 called
                 Toast from the download worker thread -> killed the update right after a
                 successful download. Post to main and never let a toast break the flow. */
              private static void toastSafe(final Context ctx, final String msg) {
                try {
                  new android.os.Handler(android.os.Looper.getMainLooper()).post(new Runnable() {
                    @Override
                    public void run() {
                      try {
                        android.widget.Toast.makeText(ctx, msg, android.widget.Toast.LENGTH_LONG).show();
                      } catch (Exception e) {}
                    }
                  });
                } catch (Exception e) {}
              }

            @PluginMethod
            public void getAppVersionCode(PluginCall call) {
              try {
                Context ctx = getContext();
                PackageInfo pi = ctx.getPackageManager().getPackageInfo(ctx.getPackageName(), 0);
                long code = (Build.VERSION.SDK_INT >= 28) ? pi.getLongVersionCode() : pi.versionCode;
                JSObject ret = new JSObject();
                ret.put("value", (int) code);
                call.resolve(ret);
              } catch (Exception e) {
                JSObject ret = new JSObject();
                ret.put("value", 0);
                call.resolve(ret);
              }
            }

            @PluginMethod
            public void cancelDownload(PluginCall call) {
              cancelled = true;
              call.resolve();
            }

            @PluginMethod
            public void downloadAndInstall(final PluginCall call) {
              final String url = call.getString("url");
              if (url == null || url.length() == 0) { call.reject("url required"); return; }
              final String md5 = call.getString("md5");
              Integer sizeInt = call.getInt("size");
              final long expectSize = (sizeInt != null && sizeInt > 0) ? sizeInt : 0L;
              final Context ctx = getContext();
              // v0.11.2: Android 8+ requires the per-app "install unknown apps" grant.
              if (Build.VERSION.SDK_INT >= 26 && !ctx.getPackageManager().canRequestPackageInstalls()) {
                try {
                  Intent si = new Intent(android.provider.Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                      Uri.parse("package:" + ctx.getPackageName()));
                  si.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  ctx.startActivity(si);
                  toastSafe(ctx, "Please allow Install unknown apps, then tap update again");
                } catch (Exception ex) {
                  toastSafe(ctx, "Grant install permission in Settings > Apps > Sinoky");
                }
                call.reject("install_permission_required");
                return;
              }
              if (downloading) { call.reject("download_in_progress"); return; }
              downloading = true;
              cancelled = false;
              final File out = new File(ctx.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "sinoky-update.apk");
              new Thread(new Runnable() {
                @Override
                public void run() {
                  try {
                    HttpURLConnection conn = (HttpURLConnection) new URL(url).openConnection();
                    conn.setConnectTimeout(15000);
                    conn.setReadTimeout(30000);
                    conn.setInstanceFollowRedirects(true);
                    conn.connect();
                    int http = conn.getResponseCode();
                    if (http < 200 || http >= 300) {
                      downloading = false;
                      conn.disconnect();
                      call.reject("download failed: HTTP " + http);
                      return;
                    }
                    long total = conn.getContentLength();
                    if (expectSize > 0 && total > 0 && Math.abs(total - expectSize) > 1024) {
                      downloading = false;
                      conn.disconnect();
                      call.reject("size mismatch: expected " + expectSize + ", got " + total + " (new APK may not be live yet, retry later)");
                      return;
                    }
                    InputStream in = conn.getInputStream();
                    FileOutputStream fos = new FileOutputStream(out);
                    MessageDigest dig = null;
                    try {
                      if (md5 != null && md5.trim().length() == 32) dig = MessageDigest.getInstance("MD5");
                    } catch (Exception ex) { dig = null; }
                    byte[] buf = new byte[65536];
                    long done = 0;
                    int lastPct = -1;
                    long lastEvt = 0;
                    int n;
                    while ((n = in.read(buf)) > 0) {
                      if (cancelled) {
                        try { fos.close(); in.close(); conn.disconnect(); } catch (Exception ex) {}
                        out.delete();
                        downloading = false;
                        call.reject("cancelled");
                        return;
                      }
                      fos.write(buf, 0, n);
                      if (dig != null) dig.update(buf, 0, n);
                      done += n;
                      if (total > 0) {
                        int pct = (int) (done * 100 / total);
                        long now = System.currentTimeMillis();
                        if (pct != lastPct && now - lastEvt > 400) {
                          lastPct = pct;
                          lastEvt = now;
                          JSObject st = new JSObject();
                          st.put("status", "downloading");
                          st.put("percent", pct);
                          st.put("downloaded", done);
                          st.put("total", total);
                          notifyListeners("updateProgress", st);
                        }
                      }
                    }
                    try { fos.close(); in.close(); conn.disconnect(); } catch (Exception ex) {}
                    // Sanity: a real APK must start with PK magic bytes. Cloudflare Pages
                    // serves index.html with HTTP 200 for not-yet-published /apk/ paths;
                    // this check rejects such HTML fallbacks instead of installing them.
                    FileInputStream fis = new FileInputStream(out);
                    byte[] head = new byte[4];
                    int hn = fis.read(head);
                    fis.close();
                    if (hn < 4 || head[0] != 0x50 || head[1] != 0x4B || head[2] != 0x03 || head[3] != 0x04) {
                      out.delete();
                      downloading = false;
                      call.reject("not a valid APK file (magic mismatch) - the update package may not be live yet, try again later");
                      return;
                    }
                    if (dig != null) {
                      StringBuilder sb = new StringBuilder();
                      for (byte b : dig.digest()) sb.append(String.format("%02x", b));
                      if (!sb.toString().equalsIgnoreCase(md5.trim())) {
                        out.delete();
                        downloading = false;
                        call.reject("md5 mismatch: got " + sb.substring(0, 8) + "... (download corrupted)");
                        return;
                      }
                    }
                    JSObject fin = new JSObject();
                    fin.put("status", "complete");
                    notifyListeners("updateProgress", fin);
                    toastSafe(ctx, "Download verified - starting installer");
                    Intent install = new Intent(Intent.ACTION_INSTALL_PACKAGE);
                    if (Build.VERSION.SDK_INT >= 24) {
                      Uri apkUri = FileProvider.getUriForFile(ctx, ctx.getPackageName() + ".fileprovider", out);
                      install.setDataAndType(apkUri, "application/vnd.android.package-archive");
                      install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                    } else {
                      install.setDataAndType(Uri.fromFile(out), "application/vnd.android.package-archive");
                      install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                    }
                    new android.os.Handler(android.os.Looper.getMainLooper()).post(new Runnable() {
                @Override
                public void run() {
                  try {
                    ctx.startActivity(install);
                  } catch (Exception ex) {
                    toastSafe(ctx, "Install launch failed: " + ex.getMessage());
                  }
                }
              });
                    downloading = false;
                    call.resolve();
                  } catch (Exception e) {
                    downloading = false;
                    try { out.delete(); } catch (Exception ex) {}
                    call.reject("download failed: " + e.getMessage());
                  }
                }
              }).start();
            }
          /* v0.17.0 分享卡片存相册。
             Android 10+（API 29）起，往 MediaStore 写本 App 生成的图片不需要任何存储权限；
             API < 29 需要 WRITE_EXTERNAL_STORAGE，本项目未申请该权限 → 明确返回 saved:false，
             由前端回退到长按保存 —— 宁可不做，也不弹一个莫名其妙的授权给用户。

             ⚠️ 结构铁律（踩坑记录）：用到 API 29 常量的代码**必须集中在单个 @TargetApi(29) 方法内**。
             若写在线程的匿名内部类里，lint 的 NewApi 检查跨不过匿名类边界（匿名类里看不到外层
             方法的 SDK_INT 早退守卫）→ assembleRelease 会跑 lintVitalRelease 而失败，
             表现为 CI「Build APK」exit 1，且注解里只有一句 exit code 1，极难定位。 */
          @PluginMethod
          public void saveImageToGallery(final PluginCall call) {
            final String dataUrl = call.getString("dataUrl");
            final String filename = call.getString("filename");
            if (dataUrl == null || dataUrl.length() == 0) { call.reject("dataUrl required"); return; }
            final JSObject out = new JSObject();
            out.put("saved", false);
            if (Build.VERSION.SDK_INT < 29) { call.resolve(out); return; }
            final String name = (filename == null || filename.length() == 0) ? "sinoky-share.png" : filename;
            final byte[] raw = decodeDataUrl(dataUrl);
            if (raw == null) { call.resolve(out); return; }
            new Thread(new Runnable() {
              @Override
              public void run() {
                boolean ok = false;
                try { ok = writeToGallery(raw, name); } catch (Exception e) { ok = false; }
                JSObject ret = new JSObject();
                ret.put("saved", ok);
                call.resolve(ret);
              }
            }).start();
          }

          /* data:image/png;base64,xxxx → 原始字节。只用 android.util.Base64（API 8），不涉及新 API。 */
          private byte[] decodeDataUrl(String dataUrl) {
            try {
              String b64 = dataUrl;
              int comma = b64.indexOf(',');
              if (comma >= 0) { b64 = b64.substring(comma + 1); }
              return Base64.decode(b64, Base64.DEFAULT);
            } catch (Exception e) {
              return null;
            }
          }

          /* 写进系统相册：MediaStore + RELATIVE_PATH（API 29+）→ 零存储权限。
             @TargetApi(29) 是对 lint 的显式声明：调用方已做 SDK_INT 早退，但 lint 跨不过
             匿名内部类边界，所以这里必须显式标注，否则 release 构建的 lintVital 会失败。 */
          @android.annotation.TargetApi(29)
          private boolean writeToGallery(byte[] raw, String name) throws Exception {
            Bitmap bmp = BitmapFactory.decodeByteArray(raw, 0, raw.length);
            if (bmp == null) { return false; }
            ContentValues cv = new ContentValues();
            cv.put(MediaStore.Images.Media.DISPLAY_NAME, name);
            cv.put(MediaStore.Images.Media.MIME_TYPE, "image/png");
            cv.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/Sinoky");
            cv.put(MediaStore.Images.Media.IS_PENDING, 1);
            ContentResolver cr = getContext().getContentResolver();
            Uri uri = cr.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv);
            if (uri == null) { return false; }
            OutputStream os = cr.openOutputStream(uri);
            if (os == null) { return false; }
            bmp.compress(Bitmap.CompressFormat.PNG, 100, os);
            os.flush();
            os.close();
            cv.clear();
            cv.put(MediaStore.Images.Media.IS_PENDING, 0);
            cr.update(uri, cv, null, null);
            return true;
          }

          }
          EOF
          if [ -f "$PKGDIR/MainActivity.kt" ]; then
            MA="$PKGDIR/MainActivity.kt"
            grep -q "registerPlugin(UpdatePlugin" $MA || sed -i 's#super.onCreate(savedInstanceState)#registerPlugin(UpdatePlugin::class.java)\n        super.onCreate(savedInstanceState)#' $MA
          elif [ -f "$PKGDIR/MainActivity.java" ]; then
            MA="$PKGDIR/MainActivity.java"
            cat > "$MA" <<'MAEOF'
            package app.sinoky.pwa;

            import android.os.Bundle;
            import com.getcapacitor.BridgeActivity;

            public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                registerPlugin(UpdatePlugin.class);
                super.onCreate(savedInstanceState);
              }
            }
          MAEOF
          else
            echo "::error::MainActivity not found in $PKGDIR"; ls -la "$PKGDIR"; exit 1
          fi
          echo "--- $MA ---"; cat $MA
          grep -n "registerPlugin" $MA || { echo "::error::registerPlugin inject failed"; exit 1; }
          FP=android/app/src/main/res/xml/file_paths.xml
          if [ -f "$FP" ]; then
            grep -q "ext_download" $FP || sed -i 's#</paths>#  <external-files-path name="ext_download" path="Download/" />\n</paths>#' $FP
          else
            mkdir -p android/app/src/main/res/xml
            printf '<?xml version="1.0" encoding="utf-8"?>\n<paths>\n  <external-files-path name="ext_download" path="Download/" />\n</paths>\n' > $FP
          fi
          M=android/app/src/main/AndroidManifest.xml
          grep -q "REQUEST_INSTALL_PACKAGES" $M || sed -i 's#<uses-permission android:name="android.permission.INTERNET"#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.INTERNET"#' $M
          echo "--- file_paths.xml ---"; cat $FP
          echo "--- permissions ---"; grep -o 'android.permission.[A-Z_]*' $M | sort -u

      - name: Apply launcher icons (Nuonuo adaptive icons from repo apk-icons/)
        run: cp -r apk-icons/* android/app/src/main/res/

      - name: Resolve version from index.html (single source of truth)
        id: ver
        run: |
          V=$(node -e "const h=require('fs').readFileSync('index.html','utf8');const m=h.match(/var APP_VERSION = '([\d.]+)'/);process.stdout.write(m[1])")
          IFS='.' read -r MA MI PA <<< "$V"
          CODE=$((MA*10000 + MI*100 + PA))
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "versionName/versionCode = $V / $CODE"

      - name: Stamp versionName & versionCode
        run: |
          sed -i "s/versionCode 1/versionCode ${{ steps.ver.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.ver.outputs.version }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          set +e
          ./gradlew assemble${{ env.BUILD_TYPE == 'debug' && 'Debug' || 'Release' }} --no-daemon 2>&1 | tee /tmp/gradle.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            ERR=$(grep -nE "error:|错误:|cannot find symbol|Execution failed|What went wrong|> Task .*FAILED|Unresolved reference|lint found|NewApi|requires API level|is not abstract|incompatible" /tmp/gradle.log | head -25 | tr '\n' '~')
            echo "::error title=gradle-build-failed::${ERR}"
            TAIL=$(tail -45 /tmp/gradle.log | tr '\n' '~')
            echo "::error title=gradle-tail::${TAIL}"
          fi
          exit "$RC"

      - name: Sign release with fixed keystore (in-app update requires same signature forever)
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::KEYSTORE_BASE64 secret 未配置"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          SRC=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$SRC"
          "$BT/zipalign" -p -f 4 "$SRC" android/app/build/outputs/apk/release/app-release-aligned.apk
          "$BT/apksigner" sign --ks keystore.jks --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KS_PASS" --key-pass pass:"$KEY_PASS" --out android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/app-release-aligned.apk
          "$BT/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
          rm -f keystore.jks
          echo "signed + verified OK"

      - name: Rename & expose artifact
        run: |
          T=${BUILD_TYPE}
          if [ "$T" = "debug" ]; then SRC=android/app/build/outputs/apk/debug/app-debug.apk; else SRC=android/app/build/outputs/apk/release/app-release.apk; fi
          mkdir -p dist
          cp "$SRC" "dist/Sinoky-v${{ steps.ver.outputs.version }}-$T.apk"
          ls -lh dist

      - name: Verify APK contents (in-package web version must match release version)
        run: |
          V=${{ steps.ver.outputs.version }}
          unzip -p dist/*.apk assets/public/index.html | grep -o "var APP_VERSION = '$V'" || { echo "::error::APK 内网页 APP_VERSION != $V"; exit 1; }
          echo "APK 内资产版本 = $V ✓"

      - uses: actions/upload-artifact@v4
        with:
          name: Sinoky-v${{ steps.ver.outputs.version }}-${{ env.BUILD_TYPE }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish APK to Cloudflare Pages /apk/ + inject apk url into version.json
        if: env.BUILD_TYPE == 'release'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          V=${{ steps.ver.outputs.version }}
          CODE=${{ steps.ver.outputs.code }}
          mkdir -p www/apk
          cp dist/Sinoky-v${V}-release.apk www/apk/Sinoky-v${V}-release.apk
          MD5=$(md5sum "www/apk/Sinoky-v${V}-release.apk" | cut -d' ' -f1)
          SIZE=$(stat -c%s "www/apk/Sinoky-v${V}-release.apk")
          node -e "const fs=require('fs');const p=process.argv[5];const j=JSON.parse(fs.readFileSync(p,'utf8'));j.apk={versionCode:Number(process.argv[1]),version:process.argv[2],url:'https://sinoky.pages.dev/apk/Sinoky-v'+process.argv[2]+'-release.apk',md5:process.argv[3],size:Number(process.argv[4])};fs.writeFileSync(p,JSON.stringify(j,null,2).replace(/\n/g,'\r\n')+'\r\n');console.log('injected apk (md5+size) into',p,JSON.stringify(j.apk))" "$CODE" "$V" "$MD5" "$SIZE" www/version.json
          node -e "const fs=require('fs');const p=process.argv[5];const j=JSON.parse(fs.readFileSync(p,'utf8'));j.apk={versionCode:Number(process.argv[1]),version:process.argv[2],url:'https://sinoky.pages.dev/apk/Sinoky-v'+process.argv[2]+'-release.apk',md5:process.argv[3],size:Number(process.argv[4])};fs.writeFileSync(p,JSON.stringify(j,null,2).replace(/\n/g,'\r\n')+'\r\n');console.log('injected apk (md5+size) into',p,JSON.stringify(j.apk))" "$CODE" "$V" "$MD5" "$SIZE" version.json
          npx --yes wrangler@3 pages deploy www --project-name=sinoky --branch=main
          echo "published https://sinoky.pages.dev/apk/Sinoky-v${V}-release.apk (md5=${MD5:0:8}... size=$SIZE)"
          # v0.12.0 治本：md5/size 回写仓库根 version.json——此后 push main 的 deploy
          # 永远携带完整 apk 元数据，不再覆盖掉 CI 注入结果；发布窗口期由前端
          # PK 魔数 + MD5 校验兜底（假包被拒并提示稍后重试，不可能装上坏包）。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "root version.json already in sync"
          else
            git commit -q -m "[skip ci] sync apk metadata v${V} (md5+size)" && git push -q origin HEAD:main && echo "pushed apk metadata sync to main" || echo "::warning::could not push version.json sync (main may have moved)"
          fi
          npx --yes wrangler@3 pages deploy www --project-name=sinoky --branch=main
          echo "published https://sinoky.pages.dev/apk/Sinoky-v${V}-release.apk"

      - name: Push APK to dist branch (git-protocol reachable copy)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pub
          cp dist/*.apk pub/
          cd pub
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "apk v${{ steps.ver.outputs.version }} (${BUILD_TYPE})"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" dist:dist
          echo "pushed to dist branch"

      - name: Attach APK to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
