name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      cf_token:
        description: "Cloudflare API Token. Leave empty to use repo secret."
        required: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: "${{ inputs.cf_token != '' && inputs.cf_token || secrets.CLOUDFLARE_API_TOKEN }}"
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sinoky
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
